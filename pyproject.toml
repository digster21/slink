[project]
name = "slink"
version = "0.1.0"
description = "Simple symlink manager for deploying dotfiles"
readme = "README.md"
authors = [
    { name = "digster" }
]
requires-python = ">=3.15"
dependencies = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
slink = "slink:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "N", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
