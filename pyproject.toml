[project]
name = "slink"
version = "0.1.0"
description = "Simple symlink manager for deploying dotfiles"
readme = "README.md"
authors = [
    { name = "digster" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
slink = "slink:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
